<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxoGeek — The Canon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D0D0D;
    --paper: #F0EDE6;
    --card: #151518;
    --card-hover: #1E1E24;
    --gold: #C9A84C;
    --gold-dim: #8a6f2e;
    --red: #8B2020;
    --green: #2E6B45;
    --muted: #4A4A55;
    --border: #2A2A35;
    --text: #C8C4BC;
    --text-dim: #6B6870;
    --sidebar-w: 280px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── LOADING ── */
  #loader {
    position: fixed; inset: 0;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  #loader .logo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 0.05em;
  }
  #loader .sub {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LAYOUT ── */
  #app { display: flex; min-height: 100vh; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w);
    background: #0A0A0C;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
    transition: transform 0.3s ease;
  }

  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    letter-spacing: 0.03em;
    line-height: 1.2;
  }
  .sidebar-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Global stats bar */
  .global-stats {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .stat-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--gold); }
  .progress-bar-outer {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Search */
  .sidebar-search {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--gold-dim); }
  .search-input::placeholder { color: var(--text-dim); }

  /* Sidebar filters */
  .sidebar-filters {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }

  /* Category nav */
  .cat-nav { padding: 8px 0 20px; flex: 1; }
  .cat-nav-item {
    display: block;
    padding: 6px 20px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .cat-nav-item:hover {
    color: var(--text);
    border-left-color: var(--gold-dim);
    background: rgba(255,255,255,0.02);
  }
  .cat-nav-item.active {
    color: var(--gold);
    border-left-color: var(--gold);
  }
  .cat-nav-group {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 12px 20px 4px;
    opacity: 0.6;
  }

  /* ── MAIN ── */
  #main {
    margin-left: var(--sidebar-w);
    flex: 1;
    padding: 0;
  }

  /* Top bar */
  #topbar {
    background: rgba(10,10,12,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    flex-wrap: wrap;
  }
  .view-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 14px;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .view-btn:hover, .view-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }
  .topbar-info {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── CONTENT PANELS ── */
  .panel { display: none; padding: 40px; }
  .panel.active { display: block; }

  /* ── CATEGORY CARD ── */
  .category-block {
    margin-bottom: 48px;
    scroll-margin-top: 80px;
  }
  .category-header {
    border-left: 3px solid var(--gold);
    padding-left: 16px;
    margin-bottom: 16px;
  }
  .category-super {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 4px;
  }
  .category-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--paper);
    line-height: 1.3;
    font-weight: 600;
  }
  .category-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    font-style: italic;
    line-height: 1.5;
  }
  .category-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .cat-progress-bar {
    flex: 1;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .cat-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 1px;
  }
  .cat-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* Film list */
  .film-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .film-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .film-item:hover {
    background: var(--card-hover);
    border-color: var(--muted);
    transform: translateY(-1px);
  }
  .film-item.watched {
    border-color: rgba(46,107,69,0.4);
  }
  .film-item.watched .film-title { color: var(--text); }
  .film-item.site-watched {
    border-color: rgba(201,168,76,0.3);
  }

  .film-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 10px;
  }
  .film-item.watched .film-check {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .film-item.site-watched:not(.watched) .film-check {
    background: rgba(201,168,76,0.2);
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .film-info { flex: 1; min-width: 0; }
  .film-title {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.4;
    word-break: break-word;
  }
  .film-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.6;
    margin-top: 2px;
  }
  .film-dupe-badge {
    font-size: 9px;
    background: rgba(201,168,76,0.15);
    color: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    padding: 1px 5px;
    position: absolute;
    top: 6px; right: 6px;
  }

  /* ── STATS PANEL ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
  }
  .stat-card-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .stat-card-value {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--gold);
    line-height: 1;
  }
  .stat-card-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Decade heatmap */
  .heatmap-section { margin-bottom: 40px; }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--paper);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .decade-grid {
    display: grid;
    grid-template-columns: 60px repeat(10, 1fr);
    gap: 4px;
    font-size: 11px;
  }
  .decade-label {
    color: var(--text-dim);
    display: flex;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }
  .heatmap-cell {
    aspect-ratio: 1.5;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    cursor: default;
    transition: transform 0.1s;
    position: relative;
  }
  .heatmap-cell:hover { transform: scale(1.1); z-index: 1; }
  .heatmap-col-header {
    text-align: center;
    color: var(--text-dim);
    font-size: 9px;
    letter-spacing: 0.05em;
    padding-bottom: 4px;
  }

  /* Category completion list */
  .cat-completion-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-completion-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .cat-completion-name { flex: 1; font-size: 13px; color: var(--text); }
  .cat-completion-bar { flex: 2; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .cat-completion-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; }
  .cat-completion-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); width: 36px; text-align: right; }

  /* ── DUPLICATES PANEL ── */
  .dupe-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    border-radius: 4px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .dupe-title { font-size: 13px; color: var(--paper); margin-bottom: 6px; }
  .dupe-cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .dupe-cat-tag {
    font-size: 10px;
    background: rgba(201,168,76,0.1);
    color: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    padding: 2px 8px;
  }

  /* ── DIRECTOR PANEL ── */
  .director-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 32px;
  }
  .director-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .director-card:hover {
    border-color: var(--gold-dim);
    background: var(--card-hover);
  }
  .director-name { font-size: 14px; color: var(--paper); margin-bottom: 4px; }
  .director-count { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  /* ── WATCH NEXT PANEL ── */
  .suggest-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .suggest-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .suggest-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }
  .suggestion-result {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    padding: 16px 20px;
    margin-bottom: 10px;
  }
  .suggestion-film { font-size: 1rem; color: var(--paper); font-family: 'Playfair Display', serif; }
  .suggestion-cat { font-size: 11px; color: var(--gold-dim); margin-top: 4px; }
  .suggestion-why { font-size: 12px; color: var(--text-dim); margin-top: 6px; font-style: italic; }

  /* Tooltip */
  .tooltip {
    position: absolute;
    background: #1a1a22;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
    z-index: 200;
    transform: translateY(-100%) translateY(-6px);
    left: 50%;
    transform: translate(-50%, -100%) translateY(-6px);
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  /* Mobile toggle */
  #sidebar-toggle {
    display: none;
    position: fixed;
    top: 12px; left: 12px;
    z-index: 200;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--gold);
    width: 36px; height: 36px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 768px) {
    #sidebar {
      transform: translateX(-100%);
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #main { margin-left: 0; }
    #sidebar-toggle { display: flex; }
    .panel { padding: 20px 16px; }
    #topbar { padding: 10px 16px; padding-left: 56px; }
    .film-grid { grid-template-columns: 1fr 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 480px) {
    .film-grid { grid-template-columns: 1fr; }
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .big { font-size: 2rem; margin-bottom: 8px; }

  /* highlight for search */
  mark {
    background: rgba(201,168,76,0.25);
    color: var(--gold);
    border-radius: 2px;
    padding: 0 2px;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="logo">TaxoGeek</div>
  <div class="sub">Loading the canon…</div>
  <div class="spinner"></div>
</div>

<button id="sidebar-toggle" onclick="toggleSidebar()">☰</button>

<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">TaxoGeek</div>
      <div class="sidebar-sub">The Personal Canon</div>
    </div>

    <div class="global-stats" id="global-stats"></div>

    <div class="sidebar-search">
      <input class="search-input" id="search-input" placeholder="Search films or categories…" oninput="handleSearch(this.value)">
    </div>

    <div class="sidebar-filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('unwatched', this)">Unwatched</button>
      <button class="filter-btn" onclick="setFilter('watched', this)">Watched</button>
    </div>

    <div class="cat-nav" id="cat-nav"></div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button class="view-btn active" onclick="showView('canon', this)">Canon</button>
      <button class="view-btn" onclick="showView('stats', this)">Stats</button>
      <button class="view-btn" onclick="showView('dupes', this)">Duplicates</button>
      <button class="view-btn" onclick="showView('directors', this)">Directors</button>
      <button class="view-btn" onclick="showView('next', this)">Watch Next</button>
      <span class="topbar-info" id="topbar-info"></span>
    </div>

    <!-- CANON VIEW -->
    <div class="panel active" id="view-canon">
      <div id="canon-content"></div>
    </div>

    <!-- STATS VIEW -->
    <div class="panel" id="view-stats">
      <div class="stats-grid" id="stats-cards"></div>
      <div class="heatmap-section">
        <div class="section-title">Decade × Genre Heatmap</div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:#1a3a2a"></span>Low</span>
          <span class="legend-item"><span class="legend-dot" style="background:#2E6B45"></span>Medium</span>
          <span class="legend-item"><span class="legend-dot" style="background:#C9A84C"></span>High</span>
        </div>
        <div id="heatmap"></div>
      </div>
      <div class="heatmap-section">
        <div class="section-title">Category Completion</div>
        <div class="cat-completion-list" id="cat-completion"></div>
      </div>
    </div>

    <!-- DUPLICATES VIEW -->
    <div class="panel" id="view-dupes">
      <p style="color:var(--text-dim);margin-bottom:24px;font-size:13px;">Films appearing in multiple categories — taxonomically significant cross-listings.</p>
      <div id="dupes-content"></div>
    </div>

    <!-- DIRECTORS VIEW -->
    <div class="panel" id="view-directors">
      <p style="color:var(--text-dim);margin-bottom:24px;font-size:13px;">Click a director to see all their films across categories.</p>
      <div class="director-grid" id="director-grid"></div>
      <div id="director-detail"></div>
    </div>

    <!-- WATCH NEXT VIEW -->
    <div class="panel" id="view-next">
      <div class="suggest-controls">
        <button class="suggest-btn" onclick="suggestRandom()">🎲 Surprise me</button>
        <button class="suggest-btn" onclick="suggestByGap()">📊 Fill biggest gap</button>
        <button class="suggest-btn" onclick="suggestArthouse()">🎨 Arthouse pick</button>
        <button class="suggest-btn" onclick="suggestRecent()">📅 Most recent unwatched</button>
        <button class="suggest-btn" onclick="suggestOldest()">📜 Oldest unwatched</button>
      </div>
      <div id="suggestions"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let allCategories = [];
let filmIndex = {};       // title → [catIndex, ...]
let directorIndex = {};   // director → [{film, cat, watched}]
let currentFilter = 'all';
let currentSearch = '';
const LS_KEY = 'taxogeek_watched';

function getSiteWatched() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); }
  catch { return new Set(); }
}
function setSiteWatched(set) {
  localStorage.setItem(LS_KEY, JSON.stringify([...set]));
}

// ── PARSE MARKDOWN ──
function parseMarkdown(md) {
  const lines = md.split(/\r?\n/);
  const categories = [];
  let current = null;

  for (let line of lines) {
    line = line.trim();
    if (!line || line === 'MOVIEEZ LIST' || line === 'MOVIEEEZ LIST') continue;

    // Film entry
    if (line.startsWith('- [')) {
      if (!current) continue;
      const watched = line.startsWith('- [x]') || line.startsWith('- [X]');
      const raw = line.replace(/^- \[[xX ]\] ?/, '').trim();
      // Extract year
      const yearMatch = raw.match(/\((\d{4})\)\s*(?:—.*)?$/);
      const year = yearMatch ? parseInt(yearMatch[1]) : null;
      const title = raw.replace(/\s*\(\d{4}\).*$/, '').trim();
      // Extract note (after —)
      const noteMatch = raw.match(/\(\d{4}\)\s*—\s*(.+)$/);
      const note = noteMatch ? noteMatch[1].trim() : null;

      current.films.push({ title, year, watched, note, raw });
    } else if (line.length > 3 && !line.startsWith('#')) {
      // Category header — split name and description
      const parenMatch = line.match(/^(.+?)\s*\((.+)\)\s*$/);
      let name, desc;
      if (parenMatch) {
        name = parenMatch[1].trim();
        desc = parenMatch[2].trim();
      } else {
        name = line;
        desc = null;
      }
      // Extract super-category (before —)
      const dashMatch = name.match(/^(.+?)\s*—\s*(.+)$/);
      let superCat = null, subName = name;
      if (dashMatch) {
        superCat = dashMatch[1].trim();
        subName = dashMatch[2].trim();
      }
      current = { name, superCat, subName, desc, films: [] };
      categories.push(current);
    }
  }
  return categories;
}

// ── BUILD INDEXES ──
function buildIndexes(cats) {
  filmIndex = {};
  directorIndex = {};

  cats.forEach((cat, ci) => {
    cat.films.forEach(film => {
      const key = normalizeTitle(film.title);
      if (!filmIndex[key]) filmIndex[key] = [];
      filmIndex[key].push(ci);

      // Try to extract director from title (heuristic - from category context)
      // We'll parse directors from category names/descriptions
    });
  });

  // Extract known directors from category descriptions and film titles
  const knownDirectors = [
    'Bergman','Tarkovsky','Antonioni','Godard','Truffaut','Varda','Rohmer',
    'Kieslowski','Haneke','Hitchcock','Lynch','Kubrick','Scorsese','Coppola',
    'De Palma','Tarantino','Melville','Bresson','Renoir','Fellini','Herzog',
    'Fassbinder','Wenders','Cronenberg','Polanski','Spielberg','Mann',
    'Ford','Hawks','Leone','Peckinpah','Altman','Cassavetes','Anderson',
    'Fincher','Nolan','Villeneuve','Aronofsky','Von Trier','Haneke',
    'Carax','Besson','Beineix','Clouzot','Melville','Truffaut'
  ];

  // Build from category descriptions
  cats.forEach((cat, ci) => {
    const text = (cat.name + ' ' + (cat.desc || '')).toLowerCase();
    knownDirectors.forEach(d => {
      if (text.includes(d.toLowerCase())) {
        if (!directorIndex[d]) directorIndex[d] = { films: [], cats: new Set() };
        cat.films.forEach(film => {
          directorIndex[d].films.push({ film, catName: cat.name, catIndex: ci });
          directorIndex[d].cats.add(cat.name);
        });
      }
    });
  });
}

function normalizeTitle(t) {
  return t.toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// ── RENDER CANON ──
function renderCanon(filter = 'all', search = '') {
  const siteWatched = getSiteWatched();
  const container = document.getElementById('canon-content');
  const navContainer = document.getElementById('cat-nav');
  let navHtml = '';
  let html = '';

  const searchLower = search.toLowerCase();

  let lastSuper = null;

  allCategories.forEach((cat, ci) => {
    // Filter films
    let films = cat.films.filter(f => {
      const fw = f.watched || siteWatched.has(normalizeTitle(f.title));
      if (filter === 'watched' && !fw) return false;
      if (filter === 'unwatched' && fw) return false;
      if (search) {
        return f.title.toLowerCase().includes(searchLower) ||
               cat.name.toLowerCase().includes(searchLower) ||
               (cat.desc || '').toLowerCase().includes(searchLower);
      }
      return true;
    });

    if (films.length === 0 && search) return;

    const watchedCount = cat.films.filter(f =>
      f.watched || siteWatched.has(normalizeTitle(f.title))
    ).length;
    const total = cat.films.length;
    const pct = total > 0 ? Math.round(watchedCount / total * 100) : 0;

    // Nav
    if (cat.superCat !== lastSuper) {
      if (cat.superCat) navHtml += `<div class="cat-nav-group">${cat.superCat}</div>`;
      lastSuper = cat.superCat;
    }
    navHtml += `<span class="cat-nav-item" onclick="scrollToCategory(${ci})" id="nav-${ci}">${cat.subName || cat.name}</span>`;

    // Films html
    let filmsHtml = films.map(f => {
      const key = normalizeTitle(f.title);
      const fw = f.watched || siteWatched.has(key);
      const siteOnly = !f.watched && siteWatched.has(key);
      const isDupe = filmIndex[key] && filmIndex[key].length > 1;

      let displayTitle = f.title;
      if (search && searchLower) {
        displayTitle = highlightText(f.title, searchLower);
      }

      return `<div class="film-item${f.watched ? ' watched' : ''}${siteOnly ? ' site-watched' : ''}"
        onclick="toggleSiteWatch('${key.replace(/'/g,"\\'")}', this)"
        title="${fw ? 'Watched' : 'Mark as watched on site'}">
        ${isDupe ? `<span class="film-dupe-badge">×${filmIndex[key].length}</span>` : ''}
        <div class="film-check">${f.watched ? '✓' : (siteOnly ? '·' : '')}</div>
        <div class="film-info">
          <div class="film-title">${displayTitle}</div>
          ${f.year ? `<div class="film-year">${f.year}</div>` : ''}
          ${f.note ? `<div class="film-year" style="opacity:0.8;font-style:italic">${f.note}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    html += `<div class="category-block" id="cat-${ci}">
      <div class="category-header">
        ${cat.superCat ? `<div class="category-super">${cat.superCat}</div>` : ''}
        <div class="category-name">${cat.subName || cat.name}</div>
        ${cat.desc ? `<div class="category-desc">${cat.desc}</div>` : ''}
        <div class="category-meta">
          <div class="cat-progress-bar"><div class="cat-progress-fill" style="width:${pct}%"></div></div>
          <span class="cat-count">${watchedCount}/${total} · ${pct}%</span>
        </div>
      </div>
      <div class="film-grid">${filmsHtml || '<div style="color:var(--text-dim);font-size:12px;padding:8px">No films match current filter.</div>'}</div>
    </div>`;
  });

  container.innerHTML = html || '<div class="empty-state"><div class="big">∅</div>No results found.</div>';
  navContainer.innerHTML = navHtml;
}

function highlightText(text, search) {
  const regex = new RegExp(`(${search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

// ── TOGGLE SITE WATCH ──
function toggleSiteWatch(key, el) {
  const set = getSiteWatched();
  // Don't override file-watched state
  const cat = allCategories.find(c => c.films.find(f => normalizeTitle(f.title) === key));
  const film = cat && cat.films.find(f => normalizeTitle(f.title) === key);
  if (film && film.watched) return; // file is authoritative

  if (set.has(key)) set.delete(key);
  else set.add(key);
  setSiteWatched(set);
  renderCanon(currentFilter, currentSearch);
  updateGlobalStats();
}

// ── STATS ──
function renderStats() {
  const siteWatched = getSiteWatched();

  let totalFilms = 0, totalWatched = 0;
  const decadeMap = {}; // decade → {total, watched}
  const catData = [];

  allCategories.forEach(cat => {
    let cw = 0;
    cat.films.forEach(f => {
      totalFilms++;
      const fw = f.watched || siteWatched.has(normalizeTitle(f.title));
      if (fw) { totalWatched++; cw++; }
      if (f.year) {
        const decade = Math.floor(f.year / 10) * 10;
        if (!decadeMap[decade]) decadeMap[decade] = { total: 0, watched: 0 };
        decadeMap[decade].total++;
        if (fw) decadeMap[decade].watched++;
      }
    });
    catData.push({ name: cat.subName || cat.name, total: cat.films.length, watched: cw });
  });

  // Stat cards
  const pct = Math.round(totalWatched / totalFilms * 100);
  const remaining = totalFilms - totalWatched;
  document.getElementById('stats-cards').innerHTML = `
    <div class="stat-card">
      <div class="stat-card-label">Total in Canon</div>
      <div class="stat-card-value">${totalFilms}</div>
      <div class="stat-card-sub">across ${allCategories.length} categories</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Watched</div>
      <div class="stat-card-value">${totalWatched}</div>
      <div class="stat-card-sub">${pct}% complete</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Remaining</div>
      <div class="stat-card-value">${remaining}</div>
      <div class="stat-card-sub">still to see</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Categories</div>
      <div class="stat-card-value">${allCategories.length}</div>
      <div class="stat-card-sub">${catData.filter(c => c.watched === c.total).length} fully completed</div>
    </div>
  `;

  // Heatmap
  const decades = Object.keys(decadeMap).map(Number).sort();
  // Get unique genre groups for columns
  const superCats = [...new Set(allCategories.map(c => c.superCat || c.name).filter(Boolean))].slice(0, 8);

  let hmHtml = `<div class="decade-grid" style="grid-template-columns: 60px repeat(${decades.length}, 1fr)">`;
  hmHtml += `<div></div>`;
  decades.forEach(d => {
    hmHtml += `<div class="heatmap-col-header">${d}s</div>`;
  });

  // One row: overall per decade
  hmHtml += `<div class="decade-label">All</div>`;
  decades.forEach(d => {
    const data = decadeMap[d];
    const p = data.total > 0 ? data.watched / data.total : 0;
    const color = p === 0 ? '#1a1a1a' :
      p < 0.25 ? '#1a2e22' :
      p < 0.5 ? '#1e4a30' :
      p < 0.75 ? '#2E6B45' : '#C9A84C';
    hmHtml += `<div class="heatmap-cell" style="background:${color}" title="${data.watched}/${data.total} watched in ${d}s">
      <span style="color:${p>0.5?'#000':'var(--text-dim)'};">${data.watched}</span>
    </div>`;
  });

  hmHtml += '</div>';
  document.getElementById('heatmap').innerHTML = hmHtml;

  // Category completion
  const sorted = [...catData].sort((a, b) => (b.watched/b.total) - (a.watched/a.total));
  document.getElementById('cat-completion').innerHTML = sorted.map(c => {
    const p = c.total > 0 ? Math.round(c.watched / c.total * 100) : 0;
    return `<div class="cat-completion-item">
      <div class="cat-completion-name">${c.name}</div>
      <div class="cat-completion-bar"><div class="cat-completion-fill" style="width:${p}%"></div></div>
      <div class="cat-completion-pct">${p}%</div>
    </div>`;
  }).join('');
}

// ── DUPLICATES ──
function renderDupes() {
  const dupes = Object.entries(filmIndex)
    .filter(([, cats]) => cats.length > 1)
    .sort((a, b) => b[1].length - a[1].length);

  if (dupes.length === 0) {
    document.getElementById('dupes-content').innerHTML = '<div class="empty-state"><div class="big">✓</div>No duplicates found.</div>';
    return;
  }

  document.getElementById('dupes-content').innerHTML = dupes.map(([key, catIdxs]) => {
    // Find a film object to get display title
    const film = allCategories[catIdxs[0]].films.find(f => normalizeTitle(f.title) === key);
    const title = film ? film.raw : key;
    const cats = catIdxs.map(ci => `<span class="dupe-cat-tag">${allCategories[ci].subName || allCategories[ci].name}</span>`).join('');
    return `<div class="dupe-item">
      <div class="dupe-title">${film ? film.title : key} ${film && film.year ? `<span style="color:var(--text-dim);font-size:11px">(${film.year})</span>` : ''}</div>
      <div class="dupe-cats">${cats}</div>
    </div>`;
  }).join('');
}

// ── DIRECTORS ──
function renderDirectors() {
  // Extract directors from film titles that have year — and from category descriptions
  // Build a simple name-based index from all known directors in category texts
  const mentions = {};
  allCategories.forEach((cat, ci) => {
    const text = cat.name + ' ' + (cat.desc || '');
    // Match capitalized names
    const names = text.match(/[A-ZÀÂÄÈÉÊËÎÏÔÙÛÜ][a-zàâäèéêëîïôùûü]+(?:\s+[A-ZÀÂÄÈÉÊËÎÏÔÙÛÜ][a-zàâäèéêëîïôùûü]+)*/g) || [];
    names.forEach(n => {
      if (n.length > 4 && !['Cinema','Drama','Comedy','Horror','Crime','Film','French','American','European','New','Wave','Hollywood'].includes(n)) {
        if (!mentions[n]) mentions[n] = new Set();
        mentions[n].add(ci);
      }
    });
  });

  const directors = Object.entries(mentions)
    .filter(([, cats]) => cats.size >= 1)
    .sort((a, b) => b[1].size - a[1].size)
    .slice(0, 60);

  document.getElementById('director-grid').innerHTML = directors.map(([name, cats]) =>
    `<div class="director-card" onclick="showDirectorDetail('${name.replace(/'/g,"\\'")}')">
      <div class="director-name">${name}</div>
      <div class="director-count">${cats.size} categor${cats.size === 1 ? 'y' : 'ies'}</div>
    </div>`
  ).join('');

  // Store for detail
  window._directorMentions = mentions;
}

function showDirectorDetail(name) {
  const cats = window._directorMentions[name];
  if (!cats) return;
  const catList = [...cats].map(ci => {
    const cat = allCategories[ci];
    return `<div style="margin-bottom:12px">
      <div style="font-size:12px;color:var(--gold-dim);margin-bottom:6px">${cat.name}</div>
      <div class="film-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
        ${cat.films.map(f => `<div class="film-item${f.watched?' watched':''}">
          <div class="film-check">${f.watched?'✓':''}</div>
          <div class="film-info"><div class="film-title">${f.title}</div>${f.year?`<div class="film-year">${f.year}</div>`:''}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('director-detail').innerHTML = `
    <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--border)">
      <div class="section-title">${name} — All Categories</div>
      ${catList}
    </div>`;
}

// ── WATCH NEXT ──
function suggestRandom() {
  const siteWatched = getSiteWatched();
  const unwatched = [];
  allCategories.forEach((cat, ci) => {
    cat.films.forEach(f => {
      if (!f.watched && !siteWatched.has(normalizeTitle(f.title))) {
        unwatched.push({ film: f, cat });
      }
    });
  });
  if (!unwatched.length) { showSuggestions([]); return; }
  const picks = [];
  for (let i = 0; i < 5; i++) {
    picks.push(unwatched[Math.floor(Math.random() * unwatched.length)]);
  }
  showSuggestions(picks, 'Random picks from your unwatched');
}

function suggestByGap() {
  const siteWatched = getSiteWatched();
  // Find category with most unwatched but some watched (most in-progress)
  const catGaps = allCategories.map((cat, ci) => {
    const watched = cat.films.filter(f => f.watched || siteWatched.has(normalizeTitle(f.title))).length;
    const total = cat.films.length;
    const gap = total - watched;
    return { cat, ci, watched, total, gap, pct: watched / total };
  }).filter(c => c.watched > 0 && c.gap > 0)
    .sort((a, b) => b.gap - a.gap);

  const picks = [];
  catGaps.slice(0, 3).forEach(({ cat }) => {
    const unwatched = cat.films.filter(f => !f.watched && !siteWatched.has(normalizeTitle(f.title)));
    if (unwatched.length) picks.push({ film: unwatched[0], cat, why: `Biggest gap category` });
  });
  showSuggestions(picks, 'From your most incomplete categories');
}

function suggestArthouse() {
  const siteWatched = getSiteWatched();
  const arthouseKeywords = ['auteur','philosophical','new wave','experimental','avant-garde','art-house','slow cinema'];
  const arthouseCats = allCategories.filter(cat =>
    arthouseKeywords.some(kw => cat.name.toLowerCase().includes(kw) || (cat.desc||'').toLowerCase().includes(kw))
  );
  const picks = [];
  arthouseCats.forEach(cat => {
    const unwatched = cat.films.filter(f => !f.watched && !siteWatched.has(normalizeTitle(f.title)));
    if (unwatched.length) picks.push({ film: unwatched[Math.floor(Math.random() * unwatched.length)], cat });
  });
  showSuggestions(picks.slice(0, 5), 'From arthouse & auteur categories');
}

function suggestRecent() {
  const siteWatched = getSiteWatched();
  const unwatched = [];
  allCategories.forEach(cat => {
    cat.films.forEach(f => {
      if (!f.watched && !siteWatched.has(normalizeTitle(f.title)) && f.year) {
        unwatched.push({ film: f, cat });
      }
    });
  });
  unwatched.sort((a, b) => b.film.year - a.film.year);
  showSuggestions(unwatched.slice(0, 5), 'Most recent unwatched');
}

function suggestOldest() {
  const siteWatched = getSiteWatched();
  const unwatched = [];
  allCategories.forEach(cat => {
    cat.films.forEach(f => {
      if (!f.watched && !siteWatched.has(normalizeTitle(f.title)) && f.year) {
        unwatched.push({ film: f, cat });
      }
    });
  });
  unwatched.sort((a, b) => a.film.year - b.film.year);
  showSuggestions(unwatched.slice(0, 5), 'Oldest unwatched — the deep canon');
}

function showSuggestions(picks, label = '') {
  if (!picks.length) {
    document.getElementById('suggestions').innerHTML = '<div class="empty-state"><div class="big">🎉</div>You\'ve watched everything!</div>';
    return;
  }
  document.getElementById('suggestions').innerHTML = `
    ${label ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;letter-spacing:0.1em;text-transform:uppercase">${label}</div>` : ''}
    ${picks.map(p => `
      <div class="suggestion-result">
        <div class="suggestion-film">${p.film.title}${p.film.year ? ` <span style="font-size:0.8em;color:var(--text-dim)">(${p.film.year})</span>` : ''}</div>
        <div class="suggestion-cat">${p.cat.name}</div>
        ${p.why ? `<div class="suggestion-why">${p.why}</div>` : ''}
      </div>`).join('')}
  `;
}

// ── GLOBAL STATS BAR ──
function updateGlobalStats() {
  const siteWatched = getSiteWatched();
  let total = 0, watched = 0;
  allCategories.forEach(cat => {
    cat.films.forEach(f => {
      total++;
      if (f.watched || siteWatched.has(normalizeTitle(f.title))) watched++;
    });
  });
  const pct = total > 0 ? Math.round(watched / total * 100) : 0;
  document.getElementById('global-stats').innerHTML = `
    <div class="stat-row">
      <span class="stat-label">Progress</span>
      <span class="stat-value">${watched}/${total}</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" style="width:${pct}%"></div>
    </div>
    <div style="font-size:10px;color:var(--text-dim);margin-top:4px;text-align:right">${pct}% of the canon</div>
  `;
  document.getElementById('topbar-info').textContent = `${watched} watched · ${total - watched} remaining`;
}

// ── NAV ──
function scrollToCategory(ci) {
  document.querySelectorAll('.cat-nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${ci}`)?.classList.add('active');
  showView('canon', document.querySelector('.view-btn'));
  setTimeout(() => {
    document.getElementById(`cat-${ci}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function showView(view, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  btn?.classList.add('active');

  if (view === 'stats') renderStats();
  if (view === 'dupes') renderDupes();
  if (view === 'directors') renderDirectors();
  if (view === 'next') {
    document.getElementById('suggestions').innerHTML = '<div style="color:var(--text-dim);font-size:13px">Pick a mode above to get suggestions.</div>';
  }
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCanon(currentFilter, currentSearch);
}

function handleSearch(val) {
  currentSearch = val;
  renderCanon(currentFilter, currentSearch);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── INIT ──
async function init() {
  try {
    const res = await fetch('movies.md');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    allCategories = parseMarkdown(text);
    buildIndexes(allCategories);
    renderCanon();
    updateGlobalStats();
    document.getElementById('loader').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  } catch (err) {
    document.getElementById('loader').innerHTML = `
      <div class="logo" style="color:var(--red)">Error</div>
      <div class="sub">Could not load movies.md</div>
      <div style="color:var(--text-dim);font-size:12px;margin-top:8px;max-width:300px;text-align:center">
        Make sure <code style="color:var(--gold)">movies.md</code> is in the same folder as this file in your GitHub repo.
        <br><br>${err.message}
      </div>`;
  }
}

init();
</script>
